version: 2
updates:
  # NuGet packages — fallback for Renovate; weekly
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      compendium-framework:
        patterns:
          - "Compendium.*"
    # NET10-01: Directory.Packages.props pins Microsoft.Extensions.* once per target
    # (9.0.x for net9.0, 10.0.x for net10.0). A semver-major update would move the
    # net9.0 line onto the .NET 10 packages; patch and minor updates keep flowing.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
      - "github-actions"
