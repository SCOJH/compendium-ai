name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write  # nuget.org Trusted Publishing (OIDC)

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer needs full history

      # Both SDKs, as ci.yml: global.json asks for SDK 10, and the packages target net9.0 and net10.0 (NET10-01).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (unit only)
        run: |
          dotnet test -c Release --no-build \
            --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~LoadTests"

      - name: Pack domain packages (excluding tests)
        run: |
          mkdir -p artifacts
          # 17 packable projects ship from the same tag: the Compendium.Abstractions.AI
          # abstraction, the 15 Compendium.Adapters.* AI provider adapters and the GLM
          # dialect (Compendium.Adapters.ZAi.Glm).
          # Every csproj under src/ is packable; none is a *.Tests project.
          while IFS= read -r csproj; do
            name=$(basename "$csproj" .csproj)
            if [[ "$name" == Compendium.* && "$name" != *.Tests ]]; then
              echo "Packing $name"
              dotnet pack "$csproj" -c Release --no-build -o artifacts/
            fi
          done < <(find src -name '*.csproj')
          ls -la artifacts/
          count=$(ls artifacts/*.nupkg 2>/dev/null | wc -l)
          test "$count" -ge "17" || { echo "Expected at least 17 .nupkg in artifacts/ (abstraction + 15 adapters + GLM dialect), found $count"; exit 1; }

      # GitHub Packages first: it only needs GITHUB_TOKEN, and downstream consumers
      # (Nexus Directory.Packages.props) restore from this feed.
      - name: Push to GitHub Packages (primary feed)
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate

      # Trusted Publishing: OIDC -> cle ephemere nuget.org (policy SCOJH/<repo> + release.yml, owner sachahennaut)
      - name: NuGet login (OIDC)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: sachahennaut

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Pas de credential nuget.org : OIDC KO et NUGET_API_KEY vide."
            echo "::error::La release ne publie RIEN. Un warning ici a masque 5 semaines de faux vert (cf. sassy-backlog#432)."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-preview') || contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
